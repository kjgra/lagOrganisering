name: Feilvakt

# Lager en sak (issue) med etiketten «auto-feil» når en workflow feiler på
# main, eller når appen ikke svarer på helsesjekken. Samme feil gir bare én
# åpen sak; en workflow som feiler igjen blir en kommentar på den. Når appen svarer igjen, lukkes
# saken om nedetid automatisk. Bruker bare innebygd GITHUB_TOKEN, og
# repo-variabelen APP_URL for helsesjekken (uten den hoppes den over).
on:
  workflow_run:
    workflows: ["CI", "Migreringer til prod", "Preview-database", "Påminnelser", "Analyse av innspill", "Fast preview-adresse"]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  workflow:
    name: Meld feilet workflow
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: feilvakt-workflow
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Lag sak
        run: |
          jobs=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name' || true)
          log=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null | cut -f3- | sed 's/\x1b\[[0-9;]*m//g' | tail -n 40 || true)
          {
            echo "Workflowen **$RUN_NAME** feilet på \`main\` ($RUN_EVENT, commit ${RUN_SHA:0:7})."
            echo
            echo "Kjøring: $RUN_URL"
            echo
            if [ -n "$jobs" ]; then echo "Feilet:"; echo "$jobs"; echo; fi
            if [ -n "$log" ]; then
              echo "<details><summary>Siste linjer av loggen</summary>"
              echo
              echo '~~~'
              echo "$log" | sed 's/~~~/~ ~ ~/g'
              echo '~~~'
              echo
              echo "</details>"
              echo
            fi
            echo "_Opprettet automatisk av workflowen «Feilvakt»._"
          } > body.md
          .github/scripts/meld-feil.sh "Workflow feilet: $RUN_NAME" workflow body.md

  helse:
    name: Helsesjekk
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: feilvakt-helse
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      APP_URL: ${{ vars.APP_URL }}
      TITLE: "Appen svarer ikke (helsesjekk)"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Sjekk appen
        id: check
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::APP_URL er ikke satt, hopper over. Se docs/publisering.md."
            echo "status=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="${APP_URL%/}/api/helse"
          # Tre forsøk med 30 sekunders mellomrom, så et enkelt blaff ikke gir en sak.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url") || true
            code=${code:-000}
            if [ "$code" = "200" ]; then
              echo "status=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Forsøk $i: HTTP $code"
            [ "$i" -lt 3 ] && sleep 30
          done
          echo "status=down" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Meld at appen er nede
        if: steps.check.outputs.status == 'down'
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: |
          {
            echo "Helsesjekken fikk ikke svar fra \`${APP_URL%/}/api/helse\` etter tre forsøk (siste svar: HTTP $CODE, $(date -u '+%Y-%m-%d %H:%M') UTC)."
            echo
            echo "HTTP 503 betyr at appen svarer, men ikke når databasen. 000 betyr at appen ikke svarte i det hele tatt."
            echo
            echo "Kjøring: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "_Opprettet automatisk av workflowen «Feilvakt». Saken lukkes av seg selv når appen svarer igjen._"
          } > body.md
          KUN_NY=1 .github/scripts/meld-feil.sh "$TITLE" nede body.md
      - name: Lukk sak når appen svarer igjen
        if: steps.check.outputs.status == 'ok'
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label auto-feil --limit 100 --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' | head -n1)
          if [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Appen svarer igjen ($(date -u '+%Y-%m-%d %H:%M') UTC)."
          fi
